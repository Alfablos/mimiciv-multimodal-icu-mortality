[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mmim-trainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "gitpython>=3.1.46",
  "matplotlib>=3.10.8",
  "mlflow>3.11.0",
  "numpy",
  "pandas<3.0",
  "scikit-learn>=1.8.0",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "mmim-store"
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
mmim-store = { path = "../store" }
