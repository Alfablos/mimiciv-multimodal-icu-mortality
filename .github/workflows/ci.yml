name: Trainer CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  GIT_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }} # returns the name of the merge ref in PRs


jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mmim-generator
            dockerfile: generator/Dockerfile
          - image: mmim-trainer
            dockerfile: trainer/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Docker login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Docker buildx setup
        uses: docker/setup-buildx-action@v4

      - name: Validate image build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIT_SHA}"
          test -n "${GIT_REF}"

